global:
  scrape_interval: 15s
  scrape_timeout: 15s
  external_labels:
    monitor: 'adore-monitor'

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: [ 'node-exporter:9100' ]

  - job_name: 'gateway-service'
    metrics_path: '/actuator/prometheus'
    scheme: 'http'
    static_configs:
      - targets: [ 'gateway-service:8111' ]
        labels:
          service: 'gateway-service'  # 고유한 서비스 라벨 사용

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    scheme: 'http'
    static_configs:
      - targets: ['auth-service:8084']
        labels:
          service: 'auth-service'  # 고유한 서비스 라벨 사용

  - job_name: 'discovery-service'
    metrics_path: '/actuator/prometheus'
    scheme: 'http'
    static_configs:
      - targets: [ 'discovery-service:8761' ]
        labels:
          service: 'discovery-service'  # 고유한 서비스 라벨 사용

  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    scheme: 'http'
    static_configs:
      - targets: [ 'user-service:8081' ]
        labels:
          service: 'user-service'  # 고유한 서비스 라벨 사용

  - job_name: 'admin-service'
    metrics_path: '/actuator/prometheus'
    scheme: 'http'
    static_configs:
      - targets: [ 'admin-service:8083' ]
        labels:
          service: 'admin-service'  # 고유한 서비스 라벨 사용