spring:
  application:
    name: discovery-service

management:
  endpoints:
    web:
      exposure:
        include: 'prometheus'
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: 8761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    com.netflix.eureka.registry.AbstractInstanceRegistry: WARN
    root: INFO
  file:
    path: ./logs/discovery-service.log
