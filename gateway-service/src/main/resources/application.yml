logging:
  level:
    root: INFO
  file:
    path: ./logs/gateway-service.log
jwt:
  secret: "sceretsecretsecretsecretsecretsecretsecretsecretsecretsecret"
  access_exp: 259200
  refresh_exp: 8640000
server:
  port: 8111
eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    initial-instance-info-replication-interval-seconds: 10
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
springdoc:
  swagger-ui:
    path: /swagger-ui
    urls[0]:
      name: Admin Service
      url: http://gateway-service/admin/v3/api-docs
    urls[1]:
      name: User Service
      url: http://gateway-service/user/v3/api-docs
    urls[2]:
      name: Recommend Service
      url: http://gateway-service/recommend/v3/api-docs

spring:
  data:
    redis:
      repositories:
        enabled: true
      host: ${REDIS_HOST}
      port: 6379
  r2dbc:
    url: r2dbc:mariadb://${MY_SQL_HOST}:3306/adore
    username: ${MY_SQL_USER}
    password: ${MY_SQL_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: dyw1014@gachon.ac.kr
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  application:
    name: gateway-service
  config:
    import: optional:configserver:http://config-service:8888
  cloud:
    gateway:
      routes:
        - id : user-service
          uri : lb://user-service
          predicates:
            - Path=/user/**
        - id: community-service
          uri : lb://community-service
          predicates:
            - Path=/community/**
        - id: admin-service-api-docs
          uri: lb://admin-service
          predicates:
            - Path=/admin/v3/api-docs
          filters:
            - RewritePath=/admin/v3/api-docs, /v3/api-docs
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/admin/**