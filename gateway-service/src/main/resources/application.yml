logging:
  level:
    root: DEBUG
  file:
    path: ./logs/gateway-service.log
jwt:
  secret: "sceretsecretsecretsecretsecretsecretsecretsecretsecretsecret"
  access_exp: 259200
  refresh_exp: 8640000
server:
  port: 8111
eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    initial-instance-info-replication-interval-seconds: 10
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
springdoc:
  api-docs:
    version: openapi_3_1
    enabled: true
  swagger-ui:
    urls[0]:
      name: Auth Service
      url: http://localhost:8111/auth/swagger-ui
    urls[1]:
      name: Admin Service
      url: http://localhost:8111/admin/swagger-ui
    path: /auth/swagger-ui
management:
  endpoints:
    web:
      exposure:
        include: gateway
  endpoint:
    gateway:
      enabled: true # default: true
spring:
  data:
    redis:
      repositories:
        enabled: true
      host: ${REDIS_HOST}
      port: 6379
  r2dbc:
    url: r2dbc:mariadb://${MY_SQL_HOST}:3306/adore
    username: ${MY_SQL_USER}
    password: ${MY_SQL_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: dyw1014@gachon.ac.kr
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  application:
    name: gateway-service
  config:
    import: optional:configserver:http://config-service:8888
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false
      routes:
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/admin/**
          filters:
            - RewritePath=/admin/(?<segment>.*), /admin/${segment}