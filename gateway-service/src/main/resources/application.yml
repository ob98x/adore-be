logging:
  level:
    root: INFO
  file:
    path: ./logs/gateway-service.log

jwt:
  secret: ${JWT_SECRET}

server:
  port: 8111
eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    initial-instance-info-replication-interval-seconds: 10
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka/


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    urls[0]:
      name: Auth Service
      url: http://localhost:8111/auth/swagger-ui
    urls[1]:
      name: Admin Service
      url: http://localhost:8111/admin/swagger-ui
    path: /auth/swagger-ui

spring:

  application:
    name: gateway-service

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      discovery:
        locator:
          enabled: true
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: 'https://www.gachdong.club, https://gachdong.club, https://gateway-dev.gachdong.club'
            allow-credentials: true
            allowedHeaders: '*'
            allowedMethods:
              - PUT
              - GET
              - POST
              - DELETE
              - OPTIONS
      routes:
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/admin/**
          filters:
            - RewritePath=/admin/(?<segment>.*), /admin/${segment}
            - name: JwtFilter
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/(?<segment>.*), /auth/${segment}
        - id: auth-service-security
          uri: lb://auth-service
          predicates:
            - Path=/auth/logout
          filters:
            - RewritePath=/auth/logout/(?<segment>.*), /auth/logout/${segment}
            - name: JwtFilter