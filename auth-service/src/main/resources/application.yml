logging:
  level:
    root: INFO
  file:
    path: ./logs/auth-service.log

management:
  endpoints:
    web:
      exposure:
        include: "*"

server:
  port: 8084
springdoc:
  api-docs:
    enabled: true
    path: /auth/swagger-ui
    version: openapi_3_1
  enable-spring-security: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json


spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: dyw1014@gachon.ac.kr
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  data:
    redis:
      repositories:
        enabled: true
      host: ${REDIS_HOST}
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${MY_SQL_HOST}:3306/adore
    username: ${MY_SQL_USER}
    password: ${MY_SQL_PASSWORD}
  application:
    name: auth-service
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${server.port}
jwt:
  access_exp: 360000
  refresh_exp: 8400000
  secret: ${JWT_SECRET}